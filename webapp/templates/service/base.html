{% load static %}<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}{{ service_name }}</title>
    <meta name="description" content="{% block description %}実績を登録するだけで、経験年数の自動算出と職務経歴書の PDF 出力、公開ポートフォリオまで。{% endblock %}" />
    <link rel="stylesheet" href="{% static 'css/service.css' %}" />
  </head>
  <body>
    <header class="service-header">
      <a class="service-brand" href="{% url 'index' %}">{{ service_name }}</a>
      <nav>
        {% if user.is_authenticated %}
        <a class="button" href="{% url 'manage' %}">スキル実績管理へ</a>
        {% else %}
        <a class="button" href="{% url 'login' %}">ログイン</a>
        {% endif %}
      </nav>
    </header>
    <main class="service-main">{% block content %}{% endblock %}</main>
    {% include "service/footer.html" %}
  </body>
</html>
