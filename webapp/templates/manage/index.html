{% load static %}<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>スキル実績管理</title>
    <link rel="stylesheet" href="{% static 'css/manage.css' %}" />
  </head>
  <body
    data-api-bootstrap="{% url 'manage-api-bootstrap' %}"
    data-api-projects="{% url 'manage-api-projects' %}"
    data-api-skills="{% url 'manage-api-skills' %}"
    data-api-companies="{% url 'manage-api-companies' %}"
    data-api-categories="{% url 'manage-api-categories' %}"
    data-api-category-order="{% url 'manage-api-category-order' %}"
    data-api-certifications="{% url 'manage-api-certifications' %}"
    data-api-works="{% url 'manage-api-works' %}"
    data-api-upload="{% url 'manage-api-upload-image' %}"
    data-media-base="{{ MEDIA_URL }}"
    data-api-site="{% url 'manage-api-site' %}"
    data-api-skillsheet="{% url 'manage-api-skillsheet' %}"
    data-skillsheet-pdf="{% url 'manage-skillsheet-pdf' %}"
    data-skillsheet-markdown="{% url 'manage-skillsheet-markdown' %}"
  >
    <div class="app-shell">
      <header class="app-header">
        <button type="button" class="nav-toggle" id="nav-toggle" aria-controls="main-tabs" aria-expanded="false" aria-label="メニューを開閉">☰</button>
        <span class="current-page" id="current-page" aria-live="polite"></span>
        <span class="spacer"></span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="sm">ログアウト</button>
        </form>
      </header>

      <aside class="sidebar">
        <h1 class="brand">スキル実績管理</h1>
        <nav id="main-tabs" role="tablist" aria-orientation="vertical" aria-label="管理メニュー">
          <p class="nav-group" role="presentation">登録</p>
          <button type="button" role="tab" data-tab="project">案件登録</button>
          <button type="button" role="tab" data-tab="companies">会社</button>
          <p class="nav-group" role="presentation">掲載内容</p>
          <button type="button" role="tab" data-tab="skills">スキル項目管理</button>
          <button type="button" role="tab" data-tab="certifications">資格</button>
          <button type="button" role="tab" data-tab="works">実績</button>
          <button type="button" role="tab" data-tab="site">サイト情報</button>
          <p class="nav-group" role="presentation">出力・設定</p>
          <button type="button" role="tab" data-tab="skillsheet">職務経歴書</button>
          <button type="button" role="tab" data-tab="categories">種類管理</button>
        </nav>
      </aside>

      <div id="toast" class="toast" role="status" hidden></div>

      <main>
        <section id="tab-project" hidden></section>
        <section id="tab-companies" hidden></section>
        <section id="tab-skills" hidden></section>
        <section id="tab-certifications" hidden></section>
        <section id="tab-works" hidden></section>
        <section id="tab-site" hidden></section>
        <section id="tab-skillsheet" hidden></section>
        <section id="tab-categories" hidden></section>
      </main>
    </div>

    <script src="{% static 'js/manage.js' %}"></script>
  </body>
</html>
