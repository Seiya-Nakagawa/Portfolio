{% load static %}<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seiya Nakagawa | Portfolio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body
    data-static-base="{% static '' %}"
    data-api-skills="{% url 'api-skills' %}"
    data-api-certifications="{% url 'api-certifications' %}"
    data-api-works="{% url 'api-works' %}"
    data-api-site="{% url 'api-site' %}"
  >
    <header>
      <nav class="container">
        <div class="logo">SN</div>
        <ul class="nav-links glass-panel">
          <li><a href="#about" data-i18n="nav.about">About</a></li>
          <li><a href="#skills" data-i18n="nav.skills">Skills</a></li>
          <li>
            <a href="#certifications" data-i18n="nav.certifications"
              >Certifications</a
            >
          </li>
          <li><a href="#works" data-i18n="nav.works">Works</a></li>
          <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
        </ul>
        <div class="nav-tools">
          <div id="mobile-menu-btn" class="icon-btn mobile-only">
            <i class="fas fa-bars"></i>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div id="site-error"></div>
      <!-- Hero Section -->
      <section id="hero" class="hero">
        <div class="hero-content">
          <h1 id="site-name"></h1>
          <h2>
            <span id="typing-text"></span><span class="typing-cursor">|</span>
          </h2>
          <p id="site-catchphrase"></p>
        </div>
      </section>

      <!-- About Section -->
      <section id="about" class="container">
        <h2 class="section-title" data-i18n="nav.about">About</h2>
        <div class="about-grid glass-panel" style="padding: 2rem">
          <div class="about-text">
            <p id="about-intro"></p>
            <table class="profile-table">
              <tr>
                <th data-i18n="profile.age">年齢</th>
                <td id="age-display">--</td>
              </tr>
              <tr>
                <th data-i18n="profile.job">職業</th>
                <td id="about-job"></td>
              </tr>
              <tr>
                <th data-i18n="profile.education">学歴</th>
                <td id="about-education"></td>
              </tr>
              <tr>
                <th data-i18n="profile.location">居住地</th>
                <td id="about-location"></td>
              </tr>
              <tr>
                <th data-i18n="profile.hobby">趣味</th>
                <td id="about-hobby"></td>
              </tr>
              <tr>
                <th data-i18n="profile.github">GitHub URL</th>
                <td>
                  <a id="about-github" target="_blank" rel="noopener"></a>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </section>

      <!-- Skills Section -->
      <section id="skills" class="container">
        <h2 class="section-title" data-i18n="nav.skills">Skills</h2>
        <div id="skills-container" class="skills-grid">
          <!-- Injected via JS -->
        </div>
      </section>

      <!-- Certifications Section -->
      <section id="certifications" class="container">
        <h2 class="section-title" data-i18n="nav.certifications">
          Certifications
        </h2>
        <div id="certifications-container" class="certifications-grid">
          <!-- Injected via JS -->
        </div>
      </section>

      <!-- Works Section -->
      <section id="works" class="container">
        <h2 class="section-title" data-i18n="nav.works">Works</h2>
        <div id="works-container" class="works-grid">
          <!-- Injected via JS -->
        </div>
      </section>

      <!-- Contact Section -->
      <section id="contact" class="container">
        <h2 class="section-title" data-i18n="nav.contact">Contact</h2>
        <div class="contact-container glass-panel">
          <p id="contact-message"></p>
          <div
            class="contact-actions"
            style="display: flex; justify-content: center; margin-top: 2rem"
          >
            <a
              target="_blank"
              class="btn-primary"
              data-i18n="contact.btn"
              id="contact-button"
            >
              問い合わせ
            </a>
          </div>
          <div class="social-links" style="margin-top: 2rem">
            <a
              id="contact-github"
              target="_blank"
              class="icon-btn"
              style="font-size: 2rem"
            >
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer style="text-align: center; padding: 2rem; color: var(--text-muted)">
      <p>&copy; <span id="footer-copyright"></span> <span id="footer-name"></span>. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="{% static 'js/i18n.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
