[project]
name = "webapp"
version = "0.1.0"
description = "ポートフォリオサイト / スキル実績管理アプリ"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "django-environ>=0.14.0",
    "gunicorn>=26.0.0",
    "mysqlclient>=2.2.8",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
# migrations は Django が自動生成するコードであり、手動整形・lint の対象にしない。
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
# Django の Meta.constraints/indexes はモデル定義時にのみ参照される規約上の書き方であり、
# 可変なクラス属性デフォルト値（RUF012）の懸念が当てはまらない。
"**/models.py" = ["RUF012"]
