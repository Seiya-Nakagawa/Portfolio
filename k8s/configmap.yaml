# 機密情報を含まない設定値のみを保持する。機密情報は OCI Vault から同期する
# portfolio-secrets で供給する（k8s/vault-sync.yaml）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: app-prod
data:
  # サービスホストのルートで公開する。旧 URL のホストは、リダイレクトのみを応答するために許可する。
  ALLOWED_HOSTS: "skillsheet.technohonesty.com,technohonesty.com"
  SERVICE_HOST: "skillsheet.technohonesty.com"
  LEGACY_HOSTS: "technohonesty.com"
  # 旧 URL の転送先となる、運営者の公開ポートフォリオのユーザー名。
  LEGACY_REDIRECT_USERNAME: "aibdlnew1"
  DB_SOCKET_PATH: "/var/run/mysqld/mysqld.sock"
  # 登録画面（ログイン・CSRF）が Ingress で終端された HTTPS のオリジンを許可するために必要。
  CSRF_TRUSTED_ORIGINS: "https://skillsheet.technohonesty.com"
  # 流量制限の接続元 IP は、共有 Ingress が X-Forwarded-For の末尾に付与した値を用いる。
  TRUSTED_PROXY_COUNT: "1"
  # Cloudflare Web Analytics の計測用トークン。ページに埋め込まれる公開値のため ConfigMap で管理する。
  # 空の場合は計測用スクリプトを出力しない。
  CLOUDFLARE_ANALYTICS_TOKEN: "80242451ab3842d2b1a88d266ce0ec93"
