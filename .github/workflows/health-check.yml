name: Health Check

# 死活監視。サービスのヘルスチェックを 15 分ごとに確認し、異常または応答がない場合は
# 監視用の Issue を起票（または追記）してワークフローを失敗させる。復旧を確認したら、
# その Issue に復旧のコメントを残してクローズする（Issue の通知で運営者へ届く）。
# 公開リポジトリで一定期間コミットがないと定期実行が自動で無効化されるため、
# 無効化の通知を受けた場合は Actions の画面から再度有効にする。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: true

env:
  HEALTH_URL: https://skillsheet.technohonesty.com/healthz
  ISSUE_TITLE: "死活監視: ヘルスチェックの異常"
  ISSUE_LABEL: monitoring
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        id: check
        run: |
          # 一時的なネットワークの揺らぎで誤検知しないよう、間隔を空けて最大 3 回確認する。
          # 正常は「HTTP 200 かつ本文が ok」のときに限る。
          for attempt in 1 2 3; do
            status=$(curl --silent --output body.txt --write-out '%{http_code}' --max-time 30 "$HEALTH_URL" || true)
            body=$(cat body.txt 2>/dev/null || true)
            echo "attempt ${attempt}: HTTP ${status}"
            if [ "$status" = "200" ] && [ "$body" = "ok" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Report failure or recovery
        run: |
          gh label create "$ISSUE_LABEL" --color D93F0B --description "死活監視" 2>/dev/null || true
          issue=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ steps.check.outputs.healthy }}" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "復旧を確認しました。 ${run_url}"
              gh issue close "$issue"
            fi
            exit 0
          fi
          message="ヘルスチェックが異常または応答がありません (HTTP ${{ steps.check.outputs.status }})。 ${run_url}"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$message"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$message"
          fi
          echo "::error::${message}"
          exit 1
